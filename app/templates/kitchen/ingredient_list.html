{% extends "base.html" %}
{% block title %}
  <title>Ingredient list</title>
{% endblock %}
{% block content %}
  <h1>Ingredients</h1>
  {% if not objects %}
    <p>There are no ingredients in the system.</p>
  {% else %}
    <table class="table table-dark table-striped">
      <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
      </tr>
      </thead>
      <tbody>
      {% for object in objects %}
        <tr>
          <th scope="row">{{ object.id }}</th>
          <td>{{ object.name }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
