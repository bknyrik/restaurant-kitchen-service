{% if pagination.pages > 1 %}
  <div>
    <ul class="pagination">
      <li class="page-item">
        <a
            href="{{ url_for(endpoint, **endpoint_params|d({}, True)) + request|query_transform(page=pagination.prev_num) }}"
            class="page-link {% if not pagination.has_prev %} disabled {% endif %}"
        >Previous
        </a>
      </li>
      {% for page in pagination.iter_pages() %}
        {% if page %}
          <li class="page-item">
            <a
                href="{{ url_for(endpoint, **endpoint_params|d({}, True)) + request|query_transform(page=page) }}"
                class="page-link {% if pagination.page == page %} active {% endif %}"
            >{{ page }}
            </a>
          </li>
        {% else %}
          <li class="page-item"><p class="page-link disabled">...</p></li>
        {% endif %}
      {% endfor %}
      <li class="page-item">
        <a
            href="{{ url_for(endpoint, **endpoint_params|d({}, True)) + request|query_transform(page=pagination.next_num) }}"
            class="page-link {% if not pagination.has_next %} disabled {% endif %}"
        >Next
        </a>
      </li>
    </ul>
  </div>
{% endif %}
