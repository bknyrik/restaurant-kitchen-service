<div class="fs-5 d-flex bg-dark align-items-center">
  <div class="p-2"><p class="text-white">Restaurant Kitchen</p></div>
  <div class="p-2"><a class="text-white text-decoration-none" href="{{ url_for("kitchen.index") }}">Home</a></div>
  <div class="p-2"><a class="text-white text-decoration-none" href="{{ url_for("kitchen.dish_type_list") }}">Dish
    types</a></div>
  <div class="p-2"><a class="text-white text-decoration-none" href="{{ url_for("kitchen.ingredient_list") }}">Ingredients</a>
  </div>
  <div class="p-2"><a class="text-white text-decoration-none" href="{{ url_for("kitchen.dish_list") }}">Dishes</a>
  </div>
  <div class="me-auto p-2"><a class="text-white text-decoration-none" href="#">Cooks</a></div>
  {% if current_user.is_authenticated %}
    <div class="p-2"><a class="fs-5 btn btn-danger" href="{{ url_for("auth.logout") }}">Log out</a></div>
  {% else %}
    <div class="p-2"><a class="fs-5 btn btn-primary" href="{{ url_for("auth.login") }}">Log in</a></div>
  {% endif %}
</div>
